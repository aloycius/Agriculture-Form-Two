name: Deploy Agriculture Form Two to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified web-book release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download agriculture-form-two-adt-web-2026-09-06
          --repo ${{ github.repository }}
          --pattern Agriculture-Form-Two-ADT-Web.zip
          --dir release

      - name: Unpack the web book
        run: |
          unzip -q release/Agriculture-Form-Two-ADT-Web.zip -d unpacked
          mv unpacked/adt site
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
